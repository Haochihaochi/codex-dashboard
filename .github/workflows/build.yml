name: Build Windows desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Smoke-test Electron
        run: npm run test:desktop

      - name: Package Windows x64 installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test packaged application
        run: node scripts/smoke-electron.mjs --packaged

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Dashboard-windows-x64
          path: release/Codex-Dashboard-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 14
